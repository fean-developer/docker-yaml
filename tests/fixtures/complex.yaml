version: 1
from: mcr.microsoft.com/dotnet/aspnet:3.1-alpine AS final
arg:
  EnvironmentStaging: null
env:
  ASPNETCORE_ENVIRONMENT: $EnvironmentStaging
  DOTNET_USE_POLLING_FILE_WATCHER: true
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: false
copy:
  - src: .
    dest: /app
  - src: .
    dest: ./
    chown: appuser:appgroup
    afterRun: true
run:
  - apk add --no-cache icu-libs
  - apk add --no-cache icu-data-full
  - apk add --no-cache tzdata
  - apk add --no-cache busybox-extras
  - export ASPNETCORE_ENVIRONMENT=$EnvironmentStaging
  - echo $EnvironmentStaging
  - |
    addgroup -S appgroup && \
    adduser -S appuser -G appgroup
user: appuser:appgroup
entrypoint:
  - dotnet
  - "{{AppName}}.dll"

  

