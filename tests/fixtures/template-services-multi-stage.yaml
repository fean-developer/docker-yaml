version: v1
services:
  - name: dotnet-api
    stages:
      - from: mcr.microsoft.com/dotnet/sdk:${DOTNET_SDK_VERSION}
        workdir: /src
        copy:
          - src: .
            dest: /src
        run:
          - dotnet publish -c Release -o /out
      - from: mcr.microsoft.com/dotnet/aspnet:${DOTNET_RUNTIME_VERSION}
        workdir: /app
        copy:
          - src: --from=0 /out
            dest: /app
        entrypoint:
          - dotnet
          - ${APP_DLL}
